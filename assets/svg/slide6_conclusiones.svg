<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgConcl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="50%" stop-color="#101f42"/>
      <stop offset="100%" stop-color="#0a1128"/>
    </linearGradient>

    <linearGradient id="goldNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#b48324"/>
    </linearGradient>
    <linearGradient id="blueNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="greenNodeC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <filter id="shadowConcl" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glowGoldC" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#d4af37" flood-opacity="0.75"/>
    </filter>
    <filter id="glowCyanC" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.75"/>
    </filter>

    <style>
      /* Animaciones Isométricas Sociotécnicas */
      @keyframes orbitStreamDashes {
        from { stroke-dashoffset: 48; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes floatNodeNorte {
        0% { transform: translate(200px, 110px); }
        50% { transform: translate(200px, 102px); }
        100% { transform: translate(200px, 110px); }
      }
      @keyframes floatNodeEste {
        0% { transform: translate(370px, 240px); }
        50% { transform: translate(370px, 232px); }
        100% { transform: translate(370px, 240px); }
      }
      @keyframes floatNodeSur {
        0% { transform: translate(200px, 370px); }
        50% { transform: translate(200px, 362px); }
        100% { transform: translate(200px, 370px); }
      }
      @keyframes floatNodeOeste {
        0% { transform: translate(30px, 240px); }
        50% { transform: translate(30px, 232px); }
        100% { transform: translate(30px, 240px); }
      }
      @keyframes coreGlowPulse {
        0%, 100% { transform: translate(240px, 240px) scale(1); filter: drop-shadow(0 0 4px #d4af37); }
        50% { transform: translate(240px, 240px) scale(1.05); filter: drop-shadow(0 0 12px #38bdf8); }
      }

      .anim-orbit { animation: orbitStreamDashes 2.2s linear infinite; }
      .anim-node-norte { animation: floatNodeNorte 3.8s ease-in-out infinite; }
      .anim-node-este { animation: floatNodeEste 4.2s ease-in-out infinite; }
      .anim-node-sur { animation: floatNodeSur 3.6s ease-in-out infinite; }
      .anim-node-oeste { animation: floatNodeOeste 4s ease-in-out infinite; }
      .anim-core { transform-box: fill-box; transform-origin: center; animation: coreGlowPulse 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Fondo Tecnológico Académico -->
  <rect width="600" height="600" rx="12" fill="url(#bgConcl)"/>

  <!-- Órbitas Isométricas de Integración Sociotécnica Animadas -->
  <g stroke="rgba(212,175,55,0.25)" stroke-width="1.2" fill="none">
    <ellipse cx="300" cy="300" rx="220" ry="120" stroke-dasharray="6,4" class="anim-orbit"/>
    <ellipse cx="300" cy="300" rx="160" ry="85"/>
    <ellipse cx="300" cy="300" rx="90" ry="48" stroke="rgba(56,189,248,0.5)" stroke-width="1.5" stroke-dasharray="4,4" class="anim-orbit"/>
  </g>

  <!-- Rayos de Conexión entre los 4 Nodos con flujo continuo -->
  <g stroke="#38bdf8" stroke-width="2" stroke-dasharray="5,4" fill="none" class="anim-orbit">
    <line x1="300" y1="180" x2="480" y2="300"/>
    <line x1="480" y1="300" x2="300" y2="420"/>
    <line x1="300" y1="420" x2="120" y2="300"/>
    <line x1="120" y1="300" x2="300" y2="180"/>
  </g>

  <!-- Cabecera Superior -->
  <g transform="translate(30, 22)">
    <rect width="540" height="42" rx="7" fill="rgba(15, 23, 42, 0.92)" stroke="rgba(212,175,55,0.5)" stroke-width="1.5"/>
    <circle cx="22" cy="21" r="6.5" fill="#d4af37" filter="url(#glowGoldC)"/>
    <text x="38" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#f8fafc" letter-spacing="0.3">
      CONCLUSIÓN: GESTIÓN DE RRHH Y TIG
    </text>
    <g transform="translate(425, 9)">
      <rect width="95" height="24" rx="5" fill="#b48324"/>
      <text x="47.5" y="16" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#ffffff" letter-spacing="0.5" text-anchor="middle">
        WIKI TIG 2026
      </text>
    </g>
  </g>

  <!-- ═════════════════════════════════════════════════════════════════════════
       LOS 4 NODOS ISOMÉTRICOS DEL MODELO SOCIOTÉCNICO (ANIMADOS FLOTANDO)
       ═════════════════════════════════════════════════════════════════════════ -->

  <!-- NODO 1: PERSONAS (RRHH & HUMANIZACIÓN DEL TRABAJO) - NORTE -->
  <g class="anim-node-norte" filter="url(#shadowConcl)">
    <path d="M10 40 L100 0 L190 40 L100 80 Z" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <path d="M10 40 L100 80 L100 95 L10 55 Z" fill="#064e3b"/>
    <path d="M100 80 L190 40 L190 55 L100 95 Z" fill="#047857"/>
    
    <circle cx="100" cy="38" r="16" fill="url(#greenNodeC)"/>
    <text x="94" y="44" font-family="sans-serif" font-size="16">👥</text>
    
    <rect x="15" y="-12" width="170" height="24" rx="4" fill="rgba(6, 78, 59, 0.95)" stroke="#34d399" stroke-width="1"/>
    <text x="100" y="4" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="900" fill="#ecfdf5" text-anchor="middle">
      1. PERSONAS (TALENTO HUMANO)
    </text>
    <text x="100" y="68" font-family="sans-serif" font-size="7" font-weight="bold" fill="#a7f3d0" text-anchor="middle">
      Humanización • Fin del Burnout • Arraigo
    </text>
  </g>

  <!-- NODO 2: TECNOLOGÍA (TIG / SISTEMAS INTEGRADOS) - ESTE -->
  <g class="anim-node-este" filter="url(#shadowConcl)">
    <path d="M10 40 L100 0 L190 40 L100 80 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M10 40 L100 80 L100 95 L10 55 Z" fill="#0c4a6e"/>
    <path d="M100 80 L190 40 L190 55 L100 95 Z" fill="#0369a1"/>

    <circle cx="100" cy="38" r="16" fill="url(#blueNode)"/>
    <text x="94" y="44" font-family="sans-serif" font-size="16">💻</text>

    <rect x="15" y="-12" width="170" height="24" rx="4" fill="rgba(12, 74, 110, 0.95)" stroke="#38bdf8" stroke-width="1"/>
    <text x="100" y="4" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="900" fill="#e0f2fe" text-anchor="middle">
      2. TECNOLOGÍA (TIG / ERP)
    </text>
    <text x="100" y="68" font-family="sans-serif" font-size="7" font-weight="bold" fill="#bae6fd" text-anchor="middle">
      Cloud • TPS-MIS-DSS • SSOT Inmutable
    </text>
  </g>

  <!-- NODO 3: REGLAS, LEYES & GOBIERNO DE DATOS - SUR -->
  <g class="anim-node-sur" filter="url(#shadowConcl)">
    <path d="M10 40 L100 0 L190 40 L100 80 Z" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M10 40 L100 80 L100 95 L10 55 Z" fill="#78350f"/>
    <path d="M100 80 L190 40 L190 55 L100 95 Z" fill="#92400e"/>

    <circle cx="100" cy="38" r="16" fill="url(#goldNode)"/>
    <text x="94" y="44" font-family="sans-serif" font-size="16">⚖️</text>

    <rect x="15" y="-12" width="170" height="24" rx="4" fill="rgba(120, 53, 15, 0.95)" stroke="#f59e0b" stroke-width="1"/>
    <text x="100" y="4" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="900" fill="#fef08a" text-anchor="middle">
      3. REGLAS, LEYES &amp; GOBIERNO
    </text>
    <text x="100" y="68" font-family="sans-serif" font-size="7" font-weight="bold" fill="#fde68a" text-anchor="middle">
      Leyes 1904/1844 • Meritocracia • Ética
    </text>
  </g>

  <!-- NODO 4: PROCEDIMIENTOS & CALIDAD - OESTE -->
  <g class="anim-node-oeste" filter="url(#shadowConcl)">
    <path d="M10 40 L100 0 L190 40 L100 80 Z" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <path d="M10 40 L100 80 L100 95 L10 55 Z" fill="#581c87"/>
    <path d="M100 80 L190 40 L190 55 L100 95 Z" fill="#6b21a8"/>

    <circle cx="100" cy="38" r="16" fill="url(#purpleNode)"/>
    <text x="94" y="44" font-family="sans-serif" font-size="16">📋</text>

    <rect x="15" y="-12" width="170" height="24" rx="4" fill="rgba(88, 28, 135, 0.95)" stroke="#c084fc" stroke-width="1"/>
    <text x="100" y="4" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="900" fill="#faf5ff" text-anchor="middle">
      4. PROCEDIMIENTOS &amp; CALIDAD
    </text>
    <text x="100" y="68" font-family="sans-serif" font-size="7" font-weight="bold" fill="#e9d5ff" text-anchor="middle">
      Selec. Inducción • ISO 9001 • Cero Papel
    </text>
  </g>

  <!-- NÚCLEO CENTRAL: UNCo CURZAS Y GESTIÓN DE RRHH (ANIMADO PULSANDO) -->
  <g class="anim-core">
    <ellipse cx="60" cy="60" rx="50" ry="32" fill="#0f172a" stroke="#d4af37" stroke-width="2"/>
    <ellipse cx="60" cy="60" rx="42" ry="24" fill="rgba(15, 45, 89, 0.9)"/>
    <text x="60" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">
      UNCo
    </text>
    <text x="60" y="69" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="bold" fill="#f59e0b" text-anchor="middle">
      CURZAS
    </text>
    <text x="60" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="5.5" fill="#38bdf8" text-anchor="middle">
      2026
    </text>
  </g>

  <!-- Tarjeta Pie de Resumen: Las 3 Prácticas Integradas -->
  <g transform="translate(30, 500)">
    <rect width="540" height="78" rx="6" fill="rgba(15, 23, 42, 0.95)" stroke="rgba(212,175,55,0.4)" stroke-width="1"/>
    <text x="18" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#f59e0b">
      SÍNTESIS DE LAS 3 PRÁCTICAS DESARROLLADAS PARA LA WIKI:
    </text>
    
    <g transform="translate(14, 28)">
      <rect width="164" height="40" rx="3" fill="#1e293b" stroke="#34d399" stroke-width="0.8"/>
      <text x="8" y="14" font-family="sans-serif" font-size="6.5" font-weight="bold" fill="#34d399">ACT. 6: SALUD PÚBLICA</text>
      <text x="8" y="24" font-family="sans-serif" font-size="6" fill="#ffffff">Hospital Catriel (TGS)</text>
      <text x="8" y="33" font-family="sans-serif" font-size="5.5" fill="#94a3b8">Leyes 1904/1844 &amp; Arraigo</text>
    </g>

    <g transform="translate(188, 28)">
      <rect width="164" height="40" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="8" y="14" font-family="sans-serif" font-size="6.5" font-weight="bold" fill="#38bdf8">ACT. 8: REDISEÑO ECOMODA</text>
      <text x="8" y="24" font-family="sans-serif" font-size="6" fill="#ffffff">Diagnóstico de 5 preguntas</text>
      <text x="8" y="33" font-family="sans-serif" font-size="5.5" fill="#94a3b8">ERP Cloud, Intranet &amp; Cero Papel</text>
    </g>

    <g transform="translate(362, 28)">
      <rect width="164" height="40" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="0.8"/>
      <text x="8" y="14" font-family="sans-serif" font-size="6.5" font-weight="bold" fill="#f59e0b">ACT. 9: PIRÁMIDE DE SI</text>
      <text x="8" y="24" font-family="sans-serif" font-size="6" fill="#ffffff">Alineación TPS, MIS y DSS</text>
      <text x="8" y="33" font-family="sans-serif" font-size="5.5" fill="#94a3b8">Inmutabilidad anti-Terramoda</text>
    </g>
  </g>
</svg>
