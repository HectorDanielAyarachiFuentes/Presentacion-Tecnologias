<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Degradados y sombras -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1222"/>
      <stop offset="50%" stop-color="#0f1d36"/>
      <stop offset="100%" stop-color="#09101d"/>
    </linearGradient>
    <linearGradient id="crtBeige" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5efe6"/>
      <stop offset="100%" stop-color="#d6cebf"/>
    </linearGradient>
    <linearGradient id="crtScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#008080"/>
      <stop offset="100%" stop-color="#004d4d"/>
    </linearGradient>
    <linearGradient id="floppyBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="floppyBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="deskWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadowIso" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ef4444" flood-opacity="0.85"/>
    </filter>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#f59e0b" flood-opacity="0.75"/>
    </filter>

    <style>
      /* Animaciones Isométricas de Caos y Desorden */
      @keyframes floatFloppy1 {
        0% { transform: translate(140px, 270px) rotate(-10deg); }
        50% { transform: translate(140px, 260px) rotate(-8deg); }
        100% { transform: translate(140px, 270px) rotate(-10deg); }
      }
      @keyframes floatFloppy2 {
        0% { transform: translate(190px, 360px) rotate(15deg); }
        50% { transform: translate(190px, 350px) rotate(17deg); }
        100% { transform: translate(190px, 360px) rotate(15deg); }
      }
      @keyframes floatCloud {
        0% { transform: translate(360px, 410px); }
        50% { transform: translate(360px, 398px); }
        100% { transform: translate(360px, 410px); }
      }
      @keyframes pulseWarning {
        0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 3px #ef4444); }
        50% { opacity: 1; filter: drop-shadow(0 0 10px #ef4444); }
      }
      @keyframes blinkLedRed {
        0%, 49% { fill: #ef4444; filter: url(#glowRed); }
        50%, 100% { fill: #7f1d1d; filter: none; }
      }
      @keyframes blinkLedYellow {
        0%, 49% { fill: #f59e0b; filter: url(#glowGold); }
        50%, 100% { fill: #78350f; filter: none; }
      }
      @keyframes laserScanCrt {
        0% { transform: translateY(0px); opacity: 0.15; }
        50% { transform: translateY(32px); opacity: 0.7; }
        100% { transform: translateY(0px); opacity: 0.15; }
      }
      @keyframes movingDashes {
        from { stroke-dashoffset: 40; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes floatingMemos {
        0% { transform: translate(190px, 440px); }
        50% { transform: translate(190px, 432px); }
        100% { transform: translate(190px, 440px); }
      }

      .anim-floppy-1 { animation: floatFloppy1 3.5s ease-in-out infinite; }
      .anim-floppy-2 { animation: floatFloppy2 4s ease-in-out infinite; }
      .anim-cloud { animation: floatCloud 4.5s ease-in-out infinite; }
      .anim-pulse-warn { animation: pulseWarning 2s ease-in-out infinite; }
      .anim-blink-red { animation: blinkLedRed 0.9s steps(1, end) infinite; }
      .anim-blink-yellow { animation: blinkLedYellow 1.3s steps(1, end) infinite; }
      .anim-scan-crt { animation: laserScanCrt 2.5s ease-in-out infinite; }
      .anim-dashes { animation: movingDashes 2s linear infinite; }
      .anim-memos { animation: floatingMemos 3.8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Fondo Tecnológico Isométrico -->
  <rect width="600" height="600" rx="12" fill="url(#bgGrad)"/>
  
  <!-- Red de líneas de guía isométrica con movimiento -->
  <g stroke="rgba(212,175,55,0.14)" stroke-width="1" fill="none">
    <path d="M50 300 L300 150 L550 300 L300 450 Z" stroke-dasharray="6,4" class="anim-dashes"/>
    <path d="M100 300 L300 180 L500 300 L300 420 Z"/>
    <path d="M150 300 L300 210 L450 300 L300 390 Z" stroke-dasharray="8,6" class="anim-dashes"/>
    <path d="M300 50 L300 550"/>
    <path d="M50 150 L550 450"/>
    <path d="M50 450 L550 150"/>
  </g>

  <!-- Tarjeta Cabecera Superior -->
  <g transform="translate(30, 22)">
    <rect width="540" height="42" rx="7" fill="rgba(15, 23, 42, 0.92)" stroke="rgba(212,175,55,0.45)" stroke-width="1.5"/>
    <circle cx="22" cy="21" r="6.5" class="anim-blink-red"/>
    <text x="38" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#f8fafc" letter-spacing="0.3">
      DIAGNÓSTICO: FALLAS EN ECOMODA
    </text>
    <g transform="translate(425, 9)" class="anim-pulse-warn">
      <rect width="95" height="24" rx="5" fill="#dc2626"/>
      <text x="47.5" y="16" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#ffffff" letter-spacing="0.5" text-anchor="middle">
        FALLA CRÍTICA
      </text>
    </g>
  </g>

  <!-- Plataforma Isométrica Principal (Escritorio de Betty en «la cueva») -->
  <g filter="url(#shadowIso)">
    <path d="M120 370 L300 470 L480 370 L480 395 L300 495 L120 395 Z" fill="#0f172a"/>
    <path d="M300 470 L480 370 L480 395 L300 495 Z" fill="#1e293b"/>
    <path d="M120 370 L300 270 L480 370 L300 470 Z" fill="url(#deskWood)" stroke="rgba(212,175,55,0.3)" stroke-width="1.5"/>
  </g>

  <!-- COMPUTADORA CRT WINDOWS 98 / MS PAINT (ISOMÉTRICA) -->
  <g transform="translate(240, 160)" filter="url(#shadowIso)">
    <!-- Base del monitor -->
    <path d="M30 180 L80 150 L130 180 L80 210 Z" fill="#c4bcad"/>
    <path d="M30 180 L80 210 L80 220 L30 190 Z" fill="#999182"/>
    <path d="M80 210 L130 180 L130 190 L80 220 Z" fill="#b0a899"/>
    <rect x="70" y="155" width="20" height="25" fill="#a8a092"/>

    <!-- Carcasa trasera profunda del monitor CRT (cubo beige) -->
    <path d="M-10 100 L60 60 L140 100 L70 140 Z" fill="#d9d1c1"/>
    <path d="M-10 100 L70 140 L70 170 L-10 130 Z" fill="#b5ad9e"/>
    <path d="M70 140 L140 100 L140 130 L70 170 Z" fill="#c7bfae"/>

    <!-- Bisel Frontal del Monitor -->
    <path d="M-20 90 L60 45 L150 90 L70 135 Z" fill="url(#crtBeige)" stroke="#a8a092" stroke-width="1"/>
    
    <!-- Pantalla CRT con Windows 98 y MS Paint -->
    <path d="M-8 88 L58 52 L138 88 L72 124 Z" fill="url(#crtScreen)"/>
    
    <!-- Ventana de MS Paint dibujada en la pantalla CRT -->
    <path d="M5 80 L55 54 L125 84 L75 110 Z" fill="#ffffff"/>
    <path d="M5 80 L55 54 L60 56 L10 82 Z" fill="#000080"/>
    <text x="14" y="77" font-family="'Courier New', monospace" font-size="8.5" fill="#ffffff" font-weight="900">MS Paint - Balance.bmp</text>
    
    <!-- Gráficos de barras dibujados "a mano" en Paint -->
    <rect x="25" y="85" width="7" height="15" fill="#ef4444"/>
    <rect x="36" y="78" width="7" height="22" fill="#ef4444"/>
    <rect x="47" y="90" width="7" height="10" fill="#f59e0b"/>
    <rect x="58" y="75" width="7" height="25" fill="#dc2626"/>
    <path d="M20 102 L68 78" stroke="#dc2626" stroke-width="2" stroke-dasharray="2,2"/>
    <text x="73" y="99" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="900" fill="#b91c1c">¡DÉFICIT!</text>

    <!-- Línea de escaneo láser animada sobre la pantalla CRT -->
    <g class="anim-scan-crt">
      <line x1="8" y1="80" x2="115" y2="80" stroke="#38bdf8" stroke-width="2"/>
    </g>

    <!-- Alerta Flotante sobre la pantalla: "EDITADO EN MS PAINT" -->
    <g transform="translate(50, 6)" class="anim-pulse-warn">
      <rect x="0" y="0" width="168" height="38" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.8"/>
      <text x="12" y="16" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" fill="#fecaca">
        ⚠️ SIN SISTEMA CONTABLE
      </text>
      <text x="12" y="30" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff">
        Balance retocado en Paint (Win 98)
      </text>
    </g>
  </g>

  <!-- CPU DE ESCRITORIO CON DISQUETERA Y LEDS PARPADEANTES -->
  <g transform="translate(390, 260)" filter="url(#shadowIso)">
    <path d="M0 40 L45 15 L90 40 L45 65 Z" fill="#d9d1c1"/>
    <path d="M0 40 L45 65 L45 155 L0 130 Z" fill="#b5ad9e"/>
    <path d="M45 65 L90 40 L90 130 L45 155 Z" fill="#c7bfae"/>
    <rect x="10" y="65" width="26" height="4" fill="#1e293b" transform="skewY(26)"/>
    <rect x="10" y="75" width="26" height="4" fill="#1e293b" transform="skewY(26)"/>
    <circle cx="40" cy="98" r="2.5" fill="#22c55e"/>
    <circle cx="40" cy="105" r="2.5" class="anim-blink-red"/>
    <text x="6" y="125" font-family="monospace" font-size="8" font-weight="bold" fill="#f8fafc" transform="skewY(26)">PC-BETTY</text>
  </g>

  <!-- DISQUETES MAGNÉTICOS DE 3½″ FLOTANTES Y ANIMADOS -->
  <!-- Disquete 1: Terramoda (Animado flotando) -->
  <g class="anim-floppy-1" filter="url(#shadowIso)">
    <rect x="0" y="0" width="76" height="74" rx="5" fill="url(#floppyBlue)" stroke="#1d4ed8" stroke-width="1.2"/>
    <rect x="16" y="0" width="44" height="28" rx="2" fill="#e2e8f0"/>
    <rect x="6" y="32" width="64" height="36" rx="3" fill="#ffffff"/>
    <text x="10" y="46" font-family="'Segoe UI', monospace" font-size="8.5" font-weight="900" fill="#dc2626">TERRAMODA</text>
    <text x="10" y="59" font-family="'Segoe UI', monospace" font-size="7.5" font-weight="800" fill="#0f172a">Empresa Fantasma</text>
    <circle cx="62" cy="56" r="3.5" class="anim-blink-red"/>
  </g>

  <!-- Disquete 2: Costos Taller Hugo Lombardi (Animado flotando) -->
  <g class="anim-floppy-2" filter="url(#shadowIso)">
    <rect x="0" y="0" width="70" height="68" rx="4" fill="url(#floppyBlack)" stroke="#475569" stroke-width="1.2"/>
    <rect x="14" y="0" width="42" height="24" rx="2" fill="#cbd5e1"/>
    <rect x="6" y="30" width="58" height="32" rx="3" fill="#fef08a"/>
    <text x="9" y="44" font-family="'Segoe UI', monospace" font-size="8" font-weight="900" fill="#854d0e">OP 408 MERMAS</text>
    <text x="9" y="55" font-family="'Segoe UI', monospace" font-size="7" font-weight="800" fill="#000000">Desperdicio +180%</text>
  </g>

  <!-- CONMUTADOR TELEFÓNICO SATURADO (AURA MARÍA) CON LUCES PARPADEANTES -->
  <g transform="translate(80, 180)" filter="url(#shadowIso)">
    <rect x="0" y="0" width="105" height="78" rx="6" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <rect x="8" y="8" width="89" height="22" rx="3" fill="#0f172a"/>
    <text x="11" y="23" font-family="monospace" font-size="9" fill="#ef4444" font-weight="bold" class="anim-pulse-warn">LÍNEAS SATURADAS</text>
    
    <!-- Teclas del conmutador parpadeando alternadas -->
    <circle cx="20" cy="42" r="5" class="anim-blink-red"/>
    <circle cx="38" cy="42" r="5" class="anim-blink-yellow"/>
    <circle cx="56" cy="42" r="5" class="anim-blink-red"/>
    <circle cx="74" cy="42" r="5" class="anim-blink-yellow"/>
    <circle cx="20" cy="58" r="5" class="anim-blink-yellow"/>
    <circle cx="38" cy="58" r="5" class="anim-blink-red"/>
    <circle cx="56" cy="58" r="5" fill="#94a3b8"/>
    <circle cx="74" cy="58" r="5" fill="#94a3b8"/>

    <!-- Etiqueta Conmutador -->
    <g transform="translate(0, 88)">
      <rect x="0" y="0" width="112" height="24" rx="4" fill="rgba(15, 23, 42, 0.95)" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="8" y="16" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" fill="#fef08a">☎ Centralita Colapsada</text>
    </g>
  </g>

  <!-- NUBE DE RUMORES: «RADIO PASILLO» / CUARTEL DE LAS FEAS (FLOTANDO SUAVEMENTE) -->
  <g class="anim-cloud" filter="url(#shadowIso)">
    <path d="M20 20 Q10 0, 40 0 Q70 -15, 110 0 Q140 0, 150 20 Q170 45, 140 65 Q110 85, 70 70 Q30 85, 15 60 Q-5 40, 20 20 Z" fill="rgba(30, 41, 59, 0.96)" stroke="#38bdf8" stroke-width="2"/>
    <text x="24" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" fill="#38bdf8">🗣️ «RADIO PASILLO»</text>
    <text x="24" y="43" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#ffffff">Canal informal del Cuartel</text>
    <text x="24" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#94a3b8">ante falta de memos oficiales</text>
  </g>

  <!-- PILAS DE MEMOS EN PAPEL (FREDDY EN MOTO) -->
  <g class="anim-memos">
    <path d="M0 10 L50 0 L80 18 L30 28 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8"/>
    <path d="M5 14 L55 4 L85 22 L35 32 Z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/>
    <path d="M2 18 L52 8 L82 26 L32 36 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
    <text x="32" y="25" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#dc2626" transform="rotate(-10)">MEMO N° 142</text>
    <text x="14" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#f8fafc">🏍️ Memos en papel (Freddy)</text>
  </g>

  <!-- Tarjeta Pie de Gráfico: Resumen de Diagnóstico TIG -->
  <g transform="translate(30, 520)">
    <rect width="540" height="56" rx="6" fill="rgba(15, 23, 42, 0.95)" stroke="rgba(212,175,55,0.3)" stroke-width="1"/>
    <text x="18" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#f59e0b">
      SÍNTESIS DE PATOLOGÍAS SEGÚN LA GUÍA PRÁCTICA DE CÁTEDRA:
    </text>
    <text x="18" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#e2e8f0">
      • Datos secuestrados en PC de Betty • Balances truchos en MS Paint • Disquetes sin cifrado • Cuartel como red informal.
    </text>
  </g>
</svg>
